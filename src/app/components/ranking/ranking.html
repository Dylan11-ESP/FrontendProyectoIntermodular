<div class="contenedor">
    <button class="btnVolver" (click)="volver()">← Volver</button>
    <h2 class="titulo">🏆Ranking de viviendas🏆</h2>
    
    @for (v of viviendas; track $index) {
        <div class="tarjeta">
            <span class="puesto">#{{ $index + 1 }}</span>
            <div class="info">
                <strong class="tituloTarjeta">{{ v.titulo }}</strong>
                <span class="ubicacion">{{ v.ciudad }}, {{ v.pais }}</span>
            </div>
            <div class="puntuacion">
                ⭐ {{ v.puntuacionMedia | number:'1.1-1' }}
                <small>({{ v.numValoraciones }} valoraciones)</small>
            </div>
        </div>
    }
</div>
